name: 05 - Infrastructure (Terraform)

on:
  push:
    branches:
      - main
      - feature/homepage-update
    paths:
      - "terraform/**"
      - "kubernetes/local/**"
      - ".github/workflows/05-infrastructure.yml"
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform fmt, validate, plan, apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Show Terraform-created cluster
        run: |
          kind export kubeconfig --name koalatech
          kubectl get nodes -o wide

      - name: Verify Prometheus and Grafana
        run: |
          kubectl -n monitoring rollout status deployment/monitoring-grafana --timeout=300s
          kubectl get pods -n monitoring
          kubectl get svc -n monitoring

      - name: Build and load application images into kind
        working-directory: ${{ github.workspace }}
        run: |
          for s in frontend user-service student-service lecturer-service course-service enrollment-service; do
            docker build -t koalatech-$s:local ./$s
            kind load docker-image koalatech-$s:local --name koalatech
          done

      - name: Create namespace and secrets
        working-directory: ${{ github.workspace }}
        run: |
          kubectl apply -f kubernetes/local/01-namespace.yaml
          kubectl create secret generic postgres-secret --namespace production \
            --from-literal=POSTGRES_USER=postgres \
            --from-literal=POSTGRES_PASSWORD=postgres
          kubectl create secret generic application-secret --namespace production \
            --from-literal=POSTGRES_USER=postgres \
            --from-literal=POSTGRES_PASSWORD=postgres \
            --from-literal=JWT_SECRET_KEY=koalatech-local-secret \
            --from-literal=DEFAULT_ADMIN_USERNAME=admin \
            --from-literal=DEFAULT_ADMIN_EMAIL=admin@koalatech.edu.au \
            --from-literal=DEFAULT_ADMIN_PASSWORD=AdminPassword123! \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING=

      - name: Deploy application
        working-directory: ${{ github.workspace }}
        run: |
          kubectl apply -f kubernetes/local/
          kubectl wait --for=condition=available deployment --all -n production --timeout=600s

      - name: Show application resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
